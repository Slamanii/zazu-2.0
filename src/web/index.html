<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Menu</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>

<header class="store-header">
  <button id="back-btn" aria-label="Back to menu">‹</button>
  <div class="store-heading">
    <h1 id="store-name">Menu</h1>
    <p id="store-meta" class="store-meta"></p>
  </div>
  <button id="header-track" class="header-icon-btn" aria-label="Track order" style="display:none">📦</button>
  <button id="header-location" class="header-icon-btn" aria-label="Set delivery location">📍</button>
  <button id="header-cart" class="header-cart" aria-label="View cart">
    <span aria-hidden="true">🛒</span>
    <span id="header-cart-count" class="header-cart-count">0</span>
  </button>
</header>

<div class="views-container">

<!-- View: Menu -->
<main id="view-menu" class="view active">
  <input id="menu-search" class="search" type="search" placeholder="Search the menu" autocomplete="off" />
  <nav id="category-chips" class="chips" role="tablist" aria-label="Categories"></nav>
  <div id="menu-list" class="menu-list">
    <p class="status-msg">Loading menu…</p>
  </div>
</main>

<!-- View: Cart -->
<section id="view-cart" class="view slide-from-right" aria-label="Your order">
  <div id="cart-list" class="cart-list"></div>
  <div class="cart-summary">
    <span>Total</span>
    <strong id="cart-total">₦0</strong>
  </div>
  <p class="cart-note">You'll choose delivery and pay in the chat after this.</p>
  <p id="cart-error" class="cart-error" role="alert"></p>
  <button id="checkout-btn" class="primary-btn">Continue to checkout</button>
</section>

<!-- View: Track order -->
<section id="view-track" class="view slide-from-right" aria-label="Track your order">
  <div id="track-content">
    <p class="status-msg">Loading your order…</p>
  </div>
</section>

</div>

<!-- Fullscreen location picker overlay (not a view — overlays everything) -->
<div id="location-overlay" class="location-overlay" hidden>
  <div id="location-map"></div>
  <button id="location-close" class="location-close">✕ Close</button>
  <div class="location-bottom">
    <p class="location-hint">Drag the pin or tap a spot to move it to the exact drop-off point.</p>
    <p id="location-error" class="location-error-msg" role="alert"></p>
    <div class="location-actions">
      <button id="location-use-tg" class="loc-btn loc-btn-outline">📍 Use my current position</button>
      <button id="location-remove" class="loc-btn loc-btn-outline">✕ Remove pin</button>
    </div>
    <button id="location-save-btn" class="loc-btn loc-btn-primary" disabled>Save location</button>
  </div>
</div>

<!-- Cart floating button -->
<button id="cart-fab" aria-label="View cart">
  <span>🛒 View order</span>
  <span id="cart-fab-count" class="badge">0</span>
  <span id="cart-fab-total"></span>
</button>

<script src="js/index.js"></script>
</body>
</html>
