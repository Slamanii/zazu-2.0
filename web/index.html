<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <button id="back-btn">‹</button>
  <h1 id="header-title">Menu</h1>
</header>

<!-- View: Categories -->
<div id="view-categories" class="view active">
  <div class="category-grid" id="category-list">
    <p class="loading">Loading menu...</p>
  </div>
</div>

<!-- View: Items in category -->
<div id="view-items" class="view">
  <div class="item-list" id="item-list"></div>
</div>

<!-- View: Cart -->
<div id="view-cart" class="view">
  <div class="cart-list" id="cart-list"></div>
  <p class="cart-total" id="cart-total"></p>
</div>

<!-- Cart floating button -->
<button id="cart-fab">
  🛒 Cart <span id="cart-fab-count">0</span>
</button>

<script src="app.js"></script>
</body>
</html>
